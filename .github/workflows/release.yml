name: Build and publish launcher
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable launcher
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test Steam launch routing
        shell: pwsh
        run: ./scripts/test-steam.ps1
      - name: Test full roster and command HUD logic
        shell: pwsh
        run: ./scripts/test-runtime.ps1 -Version (Get-Content version.txt -Raw).Trim()
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and version.txt differ' }
          gh release create "v$version" "build/CrossfireLegion-Launcher-$version.zip" build/update.zip build/update.sha256 --title "Crossfire Legion Launcher v$version" --notes "Windows launcher with GitHub updates and reversible all-units production patch. See README for testing limits."
